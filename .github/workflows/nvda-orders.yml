name: Nightly NVDA orders

on:
  workflow_dispatch:
  schedule:
    # 03:00 UTC = 10pm EST / 11pm EDT. GitHub may start it late; that is fine
    # as long as the orders are written before the next open.
    - cron: "0 3 * * *"

concurrency:
  group: nvda-orders
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install lseg-data pandas pandas-market-calendars
      - name: Generate Sanji orders
        env:
          LSEG_APP_KEY: ${{ secrets.LSEG_APP_KEY }}
          LSEG_USERNAME: ${{ secrets.LSEG_USERNAME }}
          LSEG_PASSWORD: ${{ secrets.LSEG_PASSWORD }}
        run: python scripts/nvda_orders.py
      - name: Commit orders and site data
        id: commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update nightly NVDA orders"
          # One line, space-separated: the action reads only the first line of this input.
          file_pattern: open_orders.json mkt/open_orders.json gh-pages/helios/orders/signal.json
      - name: Redeploy Pages
        if: steps.commit.outputs.changes_detected == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
